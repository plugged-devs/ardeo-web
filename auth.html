<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Signing in to ardeo</title>
  <style>
    body { margin: 0; padding: 48px 24px; background: #F4F1EC; color: #241500;
           font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
    main { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    p { font-size: 16px; line-height: 1.5; margin: 0 0 24px; }
    /* Ink on the brand green, as the app draws it: white on this green is unreadable outdoors. */
    a.open { display: inline-block; background: #7FA074; color: #241500; text-decoration: none;
             font-weight: 700; font-size: 17px; padding: 14px 24px; border-radius: 12px; }
    .quiet { font-size: 14px; color: #796D5D; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>Opening ardeo…</h1>
    <p id="lead">If ardeo doesn’t open by itself, tap the button.</p>
    <a class="open" id="open" href="ardeo://auth">Open ardeo</a>
    <p class="quiet">Open this link on the phone you asked from, with ardeo installed.</p>
  </main>
  <script>
    // The sign-in email links here because many mail apps will not follow an
    // app's own ardeo:// link. The token is in the fragment, which the browser
    // never sends to this server; it goes on, unread, to the app, which is
    // the only thing that spends it.
    (function () {
      var hash = window.location.hash;
      if (hash.indexOf('token_hash=') === -1) {
        document.getElementById('lead').textContent =
          'This link is missing its sign-in code. Ask ardeo for a new link.';
        document.getElementById('open').style.display = 'none';
        return;
      }
      var target = 'ardeo://auth' + hash;
      document.getElementById('open').href = target;
      // Keep the token out of the browser's history once it has been read.
      history.replaceState(null, '', window.location.pathname);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
